<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LMS Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Create Peak Account</h1>
        <form action="../includes/signup_process.php" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Choose a username">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" required placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="********">
            </div>
            <div class="form-group">
                <label>Register as:</label>
                <select name="role" required style="width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 6px;">
    <option value="student">Student</option>
    <option value="instructor">Instructor</option>
</select>
            </div>
            <button type="submit" class="btn active">Create Account</button>
        </form>
        <a href="index.html" class="link">Already have an account? Login</a>
        
    </div>
</body>
</html>
